<body>
    
    <div id="time">10:00</div>
    <div id="title">חידה 5</div>
    <div id="riddle">
	ארבעתכם התקבלתם לעבוד אצל אותו הבוס, וכששאלתם מה השכר, הוא ענה כך:<br>
	"כל אחד מכם יכתוב לי מה ציפיות השכר שלו, מספר שלם עד 50,000 כולל.<br>
	האחד (או יותר) שיבחר את המספר הגבוה ביותר יפוטר מידית. השאר יקבלו את השכר."<br>
	המנצח(ים) בסבב הזה יהיה מי שיקבל את השכר הגבוה ביותר מבלי להיות מפוטר.
	  </div>
    <script type="text/javascript">//<![CDATA[


function startTimer(duration, display) {
    var timer = duration, minutes, seconds;
    setInterval(function () {
        minutes = parseInt(timer / 60, 10)
        seconds = parseInt(timer % 60, 10);

        minutes = minutes < 10 ? "0" + minutes : minutes;
        seconds = seconds < 10 ? "0" + seconds : seconds;

        display.textContent = minutes + ":" + seconds;

        if (--timer < 0) {
            timer = duration;
        }
    }, 1000);
}

window.onload = function () {
    var timeInMinutes = 60 * 10,
        display = document.querySelector('#time');
    startTimer(timeInMinutes, display);
};


  //]]></script>
