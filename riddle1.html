<!DOCTYPE html>
<html dir="rtl">

<head>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <title></title>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">


  <link rel="stylesheet" href="style.css">  


</head>

<body>

  <div id="time">10:00</div>
  <div id="title">חידה 1</div>
  <div id="riddle">
    כל שחקן מתבקש לבחור מספר בין 0 ל-100 (כולל). <br>
    השחקן שהמספר שלו יהיה הקרוב ביותר לחצי מהממוצע הכולל, יהיה המנצח. <br>
    במקרה של שוויון, כל המנצחים יקבלו מטבע.<br>
  </div>
  <script type="text/javascript">
    //<![CDATA[


    function startTimer(duration, display) {
      var timer = duration,
        minutes, seconds;
      setInterval(function () {
        minutes = parseInt(timer / 60, 10)
        seconds = parseInt(timer % 60, 10);

        minutes = minutes < 10 ? "0" + minutes : minutes;
        seconds = seconds < 10 ? "0" + seconds : seconds;

        display.textContent = minutes + ":" + seconds;

        if (--timer < 0) {
          timer = 0;
        }
      }, 1000);
    }

    window.onload = function () {
      var timeInMinutes = 60 * 10,
        display = document.querySelector('#time');
      startTimer(timeInMinutes, display);
    };


    //]]>
  </script>

</body>

</html>
